<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO AI VIDEO DIRECTOR | WEB</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <header>
                <h1>PRO AI VIDEO DIRECTOR</h1>
                <p class="subtitle">Ultimate Cinematic Suite for Seedance & Kling</p>
            </header>
            <main>
                <div class="left-panel">
                    <div class="card">
                        <h3>Optics & Style</h3>
                        <div class="grid">
                            <section>
                                <label>STYLE ARCHETYPE</label>
                                <select id="genrePreset">
                                    <option value="Cinematic">Cinematic (Balanced)</option>
                                    <option value="Horror">Horror (Atmospheric)</option>
                                    <option value="Street Style">Street Style (Raw)</option>
                                    <option value="Action">Action (Kinetic)</option>
                                    <option value="Cyberpunk">Cyberpunk (Neon)</option>
                                    <option value="SciFi">Sci-Fi (Clinical)</option>
                                    <option value="Fantasy">Fantasy (Ethereal)</option>
                                    <option value="Noir">Film Noir (B&W)</option>
                                    <option value="Western">Western (Gritty)</option>
                                    <option value="Documentary">Documentary (Real)</option>
                                </select>
                            </section>
                            <section>
                                <label>SCENE TROPE</label>
                                <select id="sceneTrope">
                                    <option value="None">None (Manual)</option>
                                    <option value="Romantic Dialogue">Romantic Dialogue</option>
                                    <option value="Found Footage">POV Found Footage</option>
                                    <option value="Slasher Chase">Slasher Chase</option>
                                    <option value="Police Interrogation">Police Interrogation</option>
                                    <option value="Superhero Landing">Superhero Landing</option>
                                    <option value="High Noon Duel">High Noon Duel</option>
                                    <option value="Nature Doc">Nature Doc</option>
                                    <option value="Vintage Memory">Vintage 8mm</option>
                                    <option value="CCTV Security">CCTV Security Cam</option>
                                    <option value="Dream Sequence">Dream Sequence</option>
                                </select>
                            </section>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Music & Score Engine</h3>
                        <div class="grid">
                            <section>
                                <label>SCORE STYLE</label>
                                <select id="musicStyle">
                                    <option value="Foley & Ambient Only">Foley/Ambient Only</option>
                                    <option value="Cinematic Orchestral">Orchestral (Strings/Brass)</option>
                                    <option value="Analog Synth">Analog Synth (Retro)</option>
                                    <option value="Industrial Percussive">Industrial (Heavy)</option>
                                    <option value="Dark Drone Ambient">Dark Ambient (Drone)</option>
                                    <option value="Acoustic Folk">Acoustic Folk (Soft)</option>
                                    <option value="Cybercore Glitch">Cybercore (Fast)</option>
                                    <option value="Epic Trailer Hybrid">Epic Hybrid</option>
                                    <option value="Jazz Noir">Jazz Noir</option>
                                </select>
                            </section>
                            <section>
                                <label>EMOTIONAL MOOD</label>
                                <select id="musicMood">
                                    <option value="Tense">Tense / Suspenseful</option>
                                    <option value="Melancholic">Melancholic / Sad</option>
                                    <option value="Heroic">Heroic / Grand</option>
                                    <option value="Ominous">Ominous / Dark</option>
                                    <option value="Aggressive">Aggressive / Intense</option>
                                    <option value="Whimsical">Whimsical / Magic</option>
                                </select>
                            </section>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Sequence Tuning</h3>
                        <div class="grid">
                            <section><label>DURATION: <span id="durVal">10</span>s</label><input type="range" id="sequenceDuration" min="3" max="15" value="10"></section>
                            <section><label>CUTS: <span id="cutVal">4</span></label><input type="range" id="cutCount" min="1" max="25" value="4"></section>
                            <section><label>GENRE INFLUENCE: <span id="infVal">5</span></label><input type="range" id="genreInfluence" min="1" max="10" value="5"></section>
                            <section><label>MOTION INTENSITY: <span id="motionVal">5</span></label><input type="range" id="motionSlider" min="1" max="10" value="5"></section>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Dialogue / Vocal Script</h3>
                        <div id="dialogueContainer"></div>
                        <button id="addLineBtn" class="btn-small">+ ADD DIALOGUE LINE</button>
                    </div>

                    <div class="card">
                        <h3>Subject Anchor</h3>
                        <textarea id="subjectInput" placeholder="Detailed subject/character description from your image..."></textarea>
                    </div>

                    <button id="generateBtn" class="btn-main">GENERATE ULTIMATE DIRECTIVE</button>
                </div>

                <div class="right-panel">
                    <div class="card output-card">
                        <textarea id="outputPrompt" readonly></textarea>
                        <button id="copyBtn" class="btn-copy">COPY TO CLIPBOARD</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
